name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Verify prepare lifecycle
        run: |
          rm -rf dist
          npm install
          test -f dist/index.js
          test -f dist/index.d.ts

      - name: Verify
        run: npm run check
      - name: Record current core version and badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 22
        run: node .pfx/release.mjs --publish

  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser runtime
        run: npm run test:browser
